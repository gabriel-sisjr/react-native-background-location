pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,ts,jsx,tsx}"
      run: npx eslint {staged_files}
    mermaid:
      glob: "website/docs/**/*.{md,mdx}"
      run: node website/scripts/validate-mermaid.mjs {staged_files}
    types:
      glob: "*.{js,ts,jsx,tsx}"
      run: npx tsc
commit-msg:
  parallel: true
  commands:
    commitlint:
      run: npx commitlint --edit
