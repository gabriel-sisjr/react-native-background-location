name: Docs Link Check

on:
  push:
    branches:
      - main
      - develop
    paths:
      - '**/*.md'
      - 'lychee.toml'
      - '.github/workflows/docs-link-check.yml'
      - 'website/scripts/validate-mermaid.mjs'
      - 'website/package.json'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - '**/*.md'
      - 'lychee.toml'
      - '.github/workflows/docs-link-check.yml'
      - 'website/scripts/validate-mermaid.mjs'
      - 'website/package.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    name: Lychee link check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check internal links and anchors (fail-blocking)
        uses: lycheeverse/lychee-action@82202e5e9c2f4ef1a55a3d02563e1cb6041e5332 # v2.6.1
        with:
          args: >-
            --offline
            --include-fragments
            --no-progress
            --config ./lychee.toml
            './**/*.md'
          fail: true

      - name: Check external links (warning only)
        uses: lycheeverse/lychee-action@82202e5e9c2f4ef1a55a3d02563e1cb6041e5332 # v2.6.1
        with:
          args: >-
            --no-progress
            --config ./lychee.toml
            './**/*.md'
          fail: false

  validate-mermaid:
    name: Validate Mermaid diagrams
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # TODO: pin actions/setup-node to a SHA once a verified digest is on hand.
      # Tag-pinning matches the convention used in deploy-docs.yml for now.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate Mermaid diagrams
        run: yarn workspace website validate:mermaid
